name: 🐛 Bug Report
description: File a bug report to help improve GRIDLOCK
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue in GRIDLOCK!
  - type: input
    id: environment
    attributes:
      label: Device & OS
      description: e.g. Android 14 / Pixel 7, iOS 17 / iPhone 15, or Emulator
      placeholder: Android 14 Emulator / Medium Phone
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 1. Go to '...' 2. Click on '....' 3. Scroll down to '....' 4. Error observed
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
